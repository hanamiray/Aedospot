<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AEDOSPOT</title>
    <link rel="icon" type="image/png" href="/static/aedospot-favicon.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0d6b3a;
            --primary-light: #1a8a4a;
            --primary-dark: #0a4f2a;
            --primary-bg: #e8f5ee;
            --text-dark: #1a2a22;
            --text-muted: rgba(26,42,34,0.6);
            --white: #ffffff;
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            -webkit-text-size-adjust: 100%;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--white);
            color: var(--text-dark);
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(1rem, 4vw, 1.5rem);
            padding-top: clamp(1.25rem, 5vh, 2.5rem);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        /* ── BACK / HOME BUTTON ── */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            transition: all var(--transition);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            max-width: 100%;
            min-height: 40px;
            white-space: nowrap;
        }

        .back-btn:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .back-btn i {
            font-size: 0.9rem;
        }

        .auth-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: clamp(1.5rem, 5vw, 2.5rem) clamp(1.2rem, 4vw, 2rem);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            width: 100%;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .auth-header .logo {
            display: inline-block;
            margin-bottom: 0.8rem;
        }

        .auth-header .logo img {
            height: clamp(34px, 9vw, 48px);
            width: auto;
            max-width: 100%;
        }

        .auth-header h1 {
            font-size: clamp(1.25rem, 4.2vw, 1.5rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-dark);
            line-height: 1.3;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: clamp(0.8rem, 2.5vw, 0.9rem);
            margin-top: 0.3rem;
            padding: 0 0.5rem;
        }

        .input-group { margin-bottom: 1rem; }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            padding: 0.8rem 1rem;
            border: 2px solid rgba(0,0,0,0.06);
            border-radius: 10px;
            font-size: 16px; /* prevents iOS auto-zoom on focus, matches ~0.95rem visually */
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            outline: none;
            transition: all var(--transition);
            background: #f8faf9;
            min-height: 44px; /* touch target */
        }

        input::placeholder { color: var(--text-muted); }

        input:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(13,107,58,0.08);
        }

        input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .verify-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .verify-row input { flex: 1 1 140px; min-width: 0; }

        .btn-send-code, .btn-verify-code {
            flex-shrink: 0;
            padding: 0 1.1rem;
            min-height: 44px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            background: var(--white);
            color: var(--primary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .btn-send-code:hover:not(:disabled), .btn-verify-code:hover:not(:disabled) {
            background: var(--primary-bg);
        }

        .btn-send-code:disabled, .btn-verify-code:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-verify-code.verified {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .security-question-box {
            font-size: 0.88rem;
            color: var(--text-dark);
            background: var(--primary-bg);
            border: 1px solid rgba(13,107,58,0.15);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin-bottom: 0.7rem;
        }

        .security-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            padding-left: 0.1rem;
        }

        .security-hint.ok { color: var(--primary); font-weight: 600; }

        .pw-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            line-height: 1.4;
        }

        .pw-strength-bar {
            width: 100%;
            height: 4px;
            background: rgba(0,0,0,0.06);
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .pw-strength-fill {
            height: 100%;
            width: 0%;
            background: #e74c3c;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.6rem;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color var(--transition);
        }

        .toggle-password:hover { color: var(--primary); }

        button.btn-reset {
            width: 100%;
            padding: 0.9rem;
            min-height: 48px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
            margin-top: 0.5rem;
        }

        button.btn-reset:hover:not(:disabled) {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(13,107,58,0.3);
        }

        button.btn-reset:active:not(:disabled) {
            transform: translateY(0);
        }

        button.btn-reset:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            padding: 0.7rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            display: none;
            text-align: center;
            margin-bottom: 1rem;
        }

        .success {
            background: var(--primary-bg);
            border: 1px solid rgba(13,107,58,0.2);
            color: var(--primary);
        }

        .error {
            background: #fde8e8;
            border: 1px solid #f5c6c6;
            color: #c0392b;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .back-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover { text-decoration: underline; }

        /* ── TABLET ── */
        @media (max-width: 900px) {
            .auth-container {
                max-width: 400px;
            }

            body {
                padding-top: clamp(1rem, 3vh, 1.75rem);
            }
        }

        /* ── LARGE PHONE / SMALL TABLET ── */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .auth-container {
                max-width: 100%;
            }

            .auth-card {
                padding: 1.8rem 1.2rem;
                border-radius: 12px;
            }
        }

        /* ── SMALL PHONE ── */
        @media (max-width: 400px) {
            .auth-card {
                padding: 1.4rem 0.9rem;
            }

            .auth-header h1 {
                font-size: 1.15rem;
            }

            .back-btn {
                font-size: 0.8rem;
                padding: 0.4rem 0.6rem;
            }

            .password-wrapper input {
                padding-right: 2.6rem;
            }

            .verify-row {
                gap: 0.5rem;
            }

            .verify-row input {
                flex-basis: 100px;
            }

            .btn-send-code, .btn-verify-code {
                padding: 0 0.85rem;
                font-size: 0.75rem;
            }
        }

        /* ── SHORT VIEWPORT (limited height, e.g. Galaxy Note5 portrait) ── */
        @media (max-height: 700px) {
            body {
                padding-top: clamp(0.75rem, 3vh, 1.25rem);
                padding-bottom: 0.75rem;
            }

            .back-btn {
                margin-bottom: 0.6rem;
            }

            .auth-header {
                margin-bottom: 1.2rem;
            }

            .auth-header .logo {
                margin-bottom: 0.5rem;
            }

            .input-group {
                margin-bottom: 0.8rem;
            }

            .back-link {
                margin-top: 1rem;
            }
        }

        /* ── VERY SHORT VIEWPORT (compact phones / landscape) ── */
        @media (max-height: 560px) {
            .auth-card {
                padding-top: 1.2rem;
                padding-bottom: 1.2rem;
            }

            .auth-header .logo img {
                height: 30px;
            }

            .auth-header {
                margin-bottom: 0.9rem;
            }
        }

        /* ── LANDSCAPE PHONE (short viewport height) ── */
        @media (max-height: 480px) and (orientation: landscape) {
            body {
                padding: 0.75rem;
                padding-top: 0.75rem;
            }

            .auth-header {
                margin-bottom: 1rem;
            }

            .input-group {
                margin-bottom: 0.7rem;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">
            <!-- ── BACK / HOME BUTTON ── -->
            <button class="back-btn" onclick="goHome()">
                <i class="fas fa-arrow-left"></i> Back to Home
            </button>

            <div class="auth-header">
                <a href="/" class="logo">
                    <img src="/static/aedospot-logo.png" alt="AEDOSPOT" onerror="this.style.display='none'">
                </a>
                <h1>Reset Password</h1>
                <p>Verify your identity to set a new password</p>
            </div>

            <div id="message" class="message"></div>

            <div class="input-group">
                <label class="form-label" for="email">Email</label>
                <div class="verify-row">
                    <input type="email" id="email" placeholder="Email">
                    <button type="button" class="btn-send-code" id="continueBtn">Continue</button>
                </div>
            </div>

            <div class="input-group" id="securityGroup" style="display:none;">
                <label class="form-label">Security Question</label>
                <div class="security-question-box" id="securityQuestionText"></div>
                <div class="verify-row">
                    <input type="text" id="securityAnswer" placeholder="Your answer" autocomplete="off">
                    <button type="button" class="btn-verify-code" id="verifyAnswerBtn">Verify</button>
                </div>
                <div class="security-hint" id="securityHint">Answer correctly to continue.</div>
            </div>

            <div class="input-group">
                <label class="form-label" for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="New Password" disabled>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('newPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div id="pwHint" class="pw-hint">
                    At least 8 characters, with uppercase, lowercase, a number, and a special character.
                </div>
                <div id="pwStrengthBar" class="pw-strength-bar">
                    <div id="pwStrengthFill" class="pw-strength-fill"></div>
                </div>
            </div>

            <div class="input-group">
                <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" disabled>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmNewPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button class="btn-reset" id="resetBtn" onclick="resetPassword()" disabled>Update Password</button>

            <div class="back-link">
                <a href="/login">Back to Log In</a>
            </div>
        </div>
    </div>

    <script>
        // ── GO HOME ──
        function goHome() {
            window.location.href = '/';
        }

        const params = new URLSearchParams(window.location.search);

        document.getElementById('email').value =
            params.get('email') || '';

        function showMessage(msg,isError=true){
            const box = document.getElementById('message'); box.textContent = msg;
            box.className =
                `message ${isError ? 'error':'success'}`;
            box.style.display = 'block';
        }

        // --- Security question verification state ---
        let answerVerified = false;
        let verifiedEmail = '';
        const emailRegex = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;

        function lockPasswordField() {
            answerVerified = false;
            verifiedEmail = '';
            document.getElementById('newPassword').disabled = true;
            document.getElementById('confirmNewPassword').disabled = true;
            document.getElementById('resetBtn').disabled = true;
        }

        function resetSecurityState() {
            lockPasswordField();
            document.getElementById('securityGroup').style.display = 'none';
            document.getElementById('securityAnswer').value = '';
            document.getElementById('securityAnswer').disabled = false;
            const verifyBtn = document.getElementById('verifyAnswerBtn');
            verifyBtn.disabled = false;
            verifyBtn.classList.remove('verified');
            verifyBtn.textContent = 'Verify';
            const hint = document.getElementById('securityHint');
            hint.textContent = 'Answer correctly to continue.';
            hint.classList.remove('ok');
            document.getElementById('continueBtn').disabled = false;
        }

        async function fetchSecurityQuestion() {
            const email = document.getElementById('email').value.trim();
            if (!emailRegex.test(email)) {
                showMessage('Please enter a valid email address first', true);
                return;
            }

            const btn = document.getElementById('continueBtn');
            btn.disabled = true;

            try {
                const res = await fetch('/api/get_security_question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.success && data.question) {
                    document.getElementById('securityQuestionText').textContent = data.question;
                    document.getElementById('securityGroup').style.display = 'block';
                    showMessage('Answer your security question to continue', false);
                } else {
                    showMessage(data.message || 'Could not find a security question for that email', true);
                    btn.disabled = false;
                }
            } catch (e) {
                showMessage('Server error', true);
                btn.disabled = false;
            }
        }

        async function verifyAnswer() {
            const email = document.getElementById('email').value.trim();
            const answer = document.getElementById('securityAnswer').value.trim();

            if (!answer) {
                showMessage('Please enter an answer', true);
                return;
            }

            try {
                const res = await fetch('/api/verify_security_answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, answer })
                });
                const data = await res.json();

                if (data.success) {
                    answerVerified = true;
                    verifiedEmail = email;
                    document.getElementById('securityAnswer').disabled = true;
                    const verifyBtn = document.getElementById('verifyAnswerBtn');
                    verifyBtn.disabled = true;
                    verifyBtn.classList.add('verified');
                    verifyBtn.textContent = 'Verified ✓';
                    const hint = document.getElementById('securityHint');
                    hint.textContent = 'Identity verified. You can now set a new password.';
                    hint.classList.add('ok');
                    document.getElementById('newPassword').disabled = false;
                    document.getElementById('confirmNewPassword').disabled = false;
                    document.getElementById('resetBtn').disabled = false;
                } else {
                    showMessage(data.message || 'Incorrect answer', true);
                }
            } catch (e) {
                showMessage('Server error', true);
            }
        }

        document.getElementById('email').addEventListener('input', () => {
            if ((answerVerified || document.getElementById('securityGroup').style.display === 'block')
                && document.getElementById('email').value.trim() !== verifiedEmail) {
                resetSecurityState();
                showMessage('Email changed — please verify again', true);
            }
        });

        document.getElementById('continueBtn').addEventListener('click', fetchSecurityQuestion);
        document.getElementById('verifyAnswerBtn').addEventListener('click', verifyAnswer);

        function checkPasswordStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[!@#$%^&*(),.?":{}|<>_\-+=\[\];'`~/\\]/.test(password)) score++;
            return score;
        }

        function updatePasswordMeter() {
            const password = document.getElementById('newPassword').value;
            const score = checkPasswordStrength(password);
            const fill = document.getElementById('pwStrengthFill');
            const pct = (score / 5) * 100;
            fill.style.width = pct + '%';

            if (score <= 2) {
                fill.style.background = '#e74c3c';
            } else if (score <= 4) {
                fill.style.background = '#f39c12';
            } else {
                fill.style.background = '#2ecc71';
            }
        }

        function isPasswordStrong(password) {
            return password.length >= 8 &&
                /[A-Z]/.test(password) &&
                /[a-z]/.test(password) &&
                /[0-9]/.test(password) &&
                /[!@#$%^&*(),.?":{}|<>_\-+=\[\];'`~/\\]/.test(password);
        }

        document.getElementById('newPassword').addEventListener('input', updatePasswordMeter);

        async function resetPassword(){
            const email = document.getElementById('email').value.trim();
            const new_password = document.getElementById('newPassword').value;
            const confirm_password = document.getElementById('confirmNewPassword').value;

            if (!answerVerified || email !== verifiedEmail) {
                showMessage('Please verify your security question answer first', true);
                return;
            }

            if (!new_password || !confirm_password) {
                showMessage('Please enter and confirm your new password', true);
                return;
            }

            if (new_password !== confirm_password) {
                showMessage('Passwords do not match', true);
                return;
            }

            if (!isPasswordStrong(new_password)) {
                showMessage('Password must be at least 8 characters and include uppercase, lowercase, a number, and a special character', true);
                return;
            }

            try{
                const res = await fetch('/api/reset_password',{ method:'POST',
                        headers:{
                            'Content-Type':'application/json'
                        },

                        body:JSON.stringify({
                            email,
                            new_password,
                            security_answer: document.getElementById('securityAnswer').value.trim()
                        })
                    });

                const data = await res.json();
                showMessage(
                    data.message,
                    !data.success
                );

                if(data.success){
                    setTimeout(()=>{
                        // '/home' now auto-routes to /admin/home or /resident/home
                        // based on the account's actual role (see app.py)
                        window.location.href='/home';
                    },1500);
                }

            }catch(e){
                showMessage(
                    'Server error',
                    true
                );
            }
        }

        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Log In | AEDOSPOT</title>
    <link rel="icon" type="image/png" href="/static/aedospot-favicon.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1e293b;
            --primary-light: #334155;
            --primary-dark: #0f172a;
            --primary-bg: #eef2f7;
            --text-dark: #1a2a22;
            --text-muted: rgba(26,42,34,0.6);
            --white: #ffffff;
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            -webkit-text-size-adjust: 100%;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--white);
            color: var(--text-dark);
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(1rem, 4vw, 1.5rem);
            padding-top: clamp(1.5rem, 6vh, 3rem);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        /* ── BACK / HOME BUTTON ── */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            transition: all var(--transition);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            max-width: 100%;
            min-height: 40px;
            white-space: nowrap;
        }

        .back-btn:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .back-btn i {
            font-size: 0.9rem;
        }

        .auth-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: clamp(1.5rem, 5vw, 2.5rem) clamp(1.2rem, 4vw, 2rem);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            width: 100%;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header .logo {
            display: inline-block;
            margin-bottom: 1rem;
        }

        .auth-header .logo img {
            height: clamp(38px, 10vw, 48px);
            width: auto;
            max-width: 100%;
        }

        .auth-header h1 {
            font-size: clamp(1.25rem, 4vw, 1.5rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-dark);
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: clamp(0.8rem, 2.5vw, 0.9rem);
            margin-top: 0.3rem;
            padding: 0 0.5rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.4rem;
        }

        .input-group input {
            width: 100%;
            max-width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid rgba(0,0,0,0.06);
            border-radius: 10px;
            font-size: 16px; /* prevents iOS auto-zoom on focus, matches ~0.95rem visually */
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            outline: none;
            transition: all var(--transition);
            background: #f8faf9;
            min-height: 44px; /* touch target */
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(13,107,58,0.08);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.6rem;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color var(--transition);
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .form-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
            margin: 0.5rem 0 1.5rem;
            font-size: 0.85rem;
        }

        .form-options .remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .form-options .remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
            min-height: 48px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .btn-login:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(13,107,58,0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .message-box {
            padding: 0.7rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            display: none;
            text-align: center;
            margin-bottom: 1rem;
        }

        .message-box.error {
            background: #fde8e8;
            border: 1px solid #f5c6c6;
            color: #c0392b;
        }

        .message-box.success {
            background: var(--primary-bg);
            border: 1px solid rgba(13,107,58,0.2);
            color: var(--primary);
        }

        /* ── TABLET ── */
        @media (max-width: 900px) {
            .auth-container {
                max-width: 420px;
            }
        }

        /* ── LARGE PHONE / SMALL TABLET ── */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .auth-container {
                max-width: 100%;
            }

            .auth-card {
                padding: 1.8rem 1.2rem;
                border-radius: 12px;
            }

            .form-options {
                flex-wrap: nowrap;
                gap: 0.5rem;
            }

            .form-options .remember {
                min-height: 40px;
                white-space: nowrap;
            }

            .form-options a {
                display: flex;
                align-items: center;
                min-height: 40px;
                white-space: nowrap;
            }

            .form-options .remember input[type="checkbox"] {
                width: 18px;
                height: 18px;
                flex-shrink: 0;
            }
        }

        /* ── SMALL PHONE ── */
        @media (max-width: 360px) {
            .auth-card {
                padding: 1.4rem 0.9rem;
            }

            .auth-header h1 {
                font-size: 1.15rem;
            }

            .back-btn {
                font-size: 0.8rem;
                padding: 0.4rem 0.6rem;
            }

            .password-wrapper input {
                padding-right: 2.6rem;
            }
        }

        /* ── SHORT VIEWPORT (limited height, e.g. Galaxy Note5 portrait) ── */
        @media (max-height: 700px) {
            body {
                padding-top: clamp(0.75rem, 3vh, 1.25rem);
                padding-bottom: 0.75rem;
            }

            .back-btn {
                margin-bottom: 0.6rem;
            }

            .auth-header {
                margin-bottom: 1rem;
            }

            .auth-header .logo {
                margin-bottom: 0.5rem;
            }

            .input-group {
                margin-bottom: 0.8rem;
            }

            .form-options {
                margin: 0.6rem 0 1rem;
            }

            .auth-footer {
                margin-top: 1rem;
            }
        }

        /* ── VERY SHORT VIEWPORT (compact phones / landscape) ── */
        @media (max-height: 560px) {
            .auth-card {
                padding-top: 1.2rem;
                padding-bottom: 1.2rem;
            }

            .auth-header .logo img {
                height: 32px;
            }

            .auth-header {
                margin-bottom: 0.75rem;
            }
        }

        /* ── LANDSCAPE PHONE (short viewport height) ── */
        @media (max-height: 480px) and (orientation: landscape) {
            body {
                padding: 0.75rem;
                padding-top: 0.75rem;
            }

            .auth-header {
                margin-bottom: 1rem;
            }

            .input-group {
                margin-bottom: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <!-- ── BACK / HOME BUTTON ── -->
            <button class="back-btn" onclick="goHome()">
                <i class="fas fa-arrow-left"></i> Back to Home
            </button>

            <div class="auth-header">
                <a href="/" class="logo">
                    <img src="/static/aedospot-logo.png" alt="AEDOSPOT" onerror="this.style.display='none'">
                </a>
                <h1>Admin Panel</h1>
                <p>AEDOSPOT — Administrator access only</p>
            </div>

            <div id="messageBox" class="message-box"></div>

            <div class="input-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" placeholder="Enter admin email" autocomplete="email">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>
                <a href="/reset-password">Forgot password?</a>
            </div>

            <button class="btn-login" id="loginBtn">Log In</button>

            <div class="auth-footer">
                <a href="/login">Resident? Log in here instead</a>
            </div>
        </div>
    </div>

    <script>
        // ── GO HOME ──
        function goHome() {
            window.location.href = '/';
        }

        function showMessage(msg, isError = true) {
            const box = document.getElementById('messageBox');
            box.textContent = msg;
            box.className = `message-box ${isError ? 'error' : 'success'}`;
            box.style.display = 'block';
            setTimeout(() => {
                box.style.display = 'none';
            }, 4000);
        }

        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('Please enter your admin username and password', true);
                return;
            }

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage(data.message, false);
                    setTimeout(() => {
                        window.location.href = '/admin/home';
                    }, 1200);
                } else {
                    showMessage(data.message, true);
                }
            } catch(e) {
                showMessage('Server error. Please try again.', true);
            }
        }

        document.getElementById('loginBtn').addEventListener('click', login);

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    login();
                }
            });
        });
    </script>

</body>
</html>
